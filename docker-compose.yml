services:
  sso-auth:
    container_name: sso-auth
    image: xct258/sso-auth:latest
    # 模板默认 host 网络：直接占用宿主机 8290
    network_mode: host
    restart: unless-stopped
    # 多进程容器用 tini 回收孤儿进程
    init: true
    # 服务停止超时（代码在 startup/services.sh 里也有声明）
    stop_grace_period: 15s
    volumes:
      # 启动脚本会把应用和前端同步到 /data；日志也在这里
      - ./data:/data
    environment:
      - LOG_BASE_DIR=/data/logs
      - SERVICE_PORT=${UVICORN_PORT:-8290}
      # 统一登录配置
      - APP_PASSWORD=${APP_PASSWORD:-}
      - APP_SECRET=${APP_SECRET:-}
      - SSO_SESSION_DAYS=${SSO_SESSION_DAYS:-7}
      - SSO_COOKIE_DOMAIN=${SSO_COOKIE_DOMAIN:-}
      - SSO_COOKIE_NAME=${SSO_COOKIE_NAME:-sso_session}
      - SSO_LOGIN_URL=${SSO_LOGIN_URL:-}
      - SSO_ALLOWED_REDIRECT_SUFFIX=${SSO_ALLOWED_REDIRECT_SUFFIX:-}
      - SSO_PUBLIC_HOST=${SSO_PUBLIC_HOST:-}
      - SSO_DEFAULT_REDIRECT=${SSO_DEFAULT_REDIRECT:-}
      - SSO_SITE_NAME=${SSO_SITE_NAME:-统一登录}
      - SSO_WALLPAPER_URL=${SSO_WALLPAPER_URL:-https://random-image.xct258.top/}
      - UVICORN_PORT=${UVICORN_PORT:-8290}
