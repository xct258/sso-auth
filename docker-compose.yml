services:
  sso-auth:
    container_name: sso-auth
    image: xct258/sso-auth:latest
    # 模板默认 host 网络：直接占用宿主机 8290
    network_mode: host
    restart: unless-stopped
    # 多进程容器用 tini 回收孤儿进程
    init: true
    # 服务停止超时（代码在 startup/services.sh 里也有声明）
    stop_grace_period: 15s
    volumes:
      # SQLite、主密钥、日志都在 /data
      - ./data:/data
    environment:
      - LOG_BASE_DIR=/data/logs
      - SERVICE_PORT=${UVICORN_PORT:-8290}

      # 初始域名（仅第一次启动创建，之后在 /admin 管理）
      - AUTH_DOMAIN_NAME=${AUTH_DOMAIN_NAME:-o1-1}
      - AUTH_HOST=${AUTH_HOST:-auth.xct258.top}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.o1-1.xct258.top}
      - AUTH_ALLOWED_SUFFIX=${AUTH_ALLOWED_SUFFIX:-.o1-1.xct258.top}
      - AUTH_SITE_NAME=${AUTH_SITE_NAME:-统一登录}
      - AUTH_WALLPAPER_URL=${AUTH_WALLPAPER_URL:-https://random-image.xct258.top/}

      # 初始管理员（仅第一次启动创建）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_HOURS=${ADMIN_SESSION_HOURS:-12}

      # 服务会话默认值与数据路径
      - SSO_SESSION_DAYS=${SSO_SESSION_DAYS:-7}
      - AUTH_DATA_DIR=/data
      - AUTH_DB_PATH=/data/auth.db
      - AUTH_KEY_PATH=/data/.master_key
      - AUTH_MASTER_KEY=${AUTH_MASTER_KEY:-}

      - UVICORN_PORT=${UVICORN_PORT:-8290}
