#!/bin/bash
# ============================================================
# 配置文件：镜像构建与应用配置
#   构建配置（CI 读取）   ：镜像名 / 标签 / 架构
#   应用配置（模板读取） ：依赖安装
#   启动流程（不在本文件）：startup/prepare.sh 每次启动
#                          startup/once.sh    只执行一次
#                          startup/main.sh    容器主进程
# ============================================================

# ------------------------------------------------------------
# 1. 构建配置：镜像仓库与标签（推送到 Docker Hub）
# ------------------------------------------------------------
IMAGE_REPO=xct258/sso-auth
IMAGE_TAG=latest

# 构建架构
PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 2. 系统依赖（apt）：一行一个
# ------------------------------------------------------------
APT_PACKAGES=(
  ca-certificates
  curl
  jq
  wget
  tar
  xz-utils
)

# ------------------------------------------------------------
# 3. 常用软件快捷开关（true / false）
# ------------------------------------------------------------
INSTALL_7Z=false

# ------------------------------------------------------------
# 4. Python 依赖（pip 包）：一行一个
#    非空时会自动安装 Python3，再用 pip 安装这些包
# ------------------------------------------------------------
PYTHON_PACKAGES=(
  uvicorn
  fastapi
  pydantic
  cryptography
)

# ------------------------------------------------------------
# 5. 自定义安装脚本（构建时执行一次）
#    下载 Node 并构建 前端/，详见 install/custom-install.sh
# ------------------------------------------------------------
INSTALL_CUSTOM=true

# ------------------------------------------------------------
# 6. 日志模块（构建时下载，安装到 /opt/startup/log.sh）
# ------------------------------------------------------------
LOG_LIB_URL=https://raw.githubusercontent.com/xct258/common/3d48863b2ba5c1de4cfacaa77993e35c77d3d675/%E8%84%9A%E6%9C%AC%E5%B7%A5%E5%85%B7/shell/%E6%97%A5%E5%BF%97%E8%AE%B0%E5%BD%95%E5%92%8C%E6%8E%A8%E9%80%81/log.sh
