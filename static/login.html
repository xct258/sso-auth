<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>统一登录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #38bdf8;
      --card: rgba(10, 15, 30, 0.74);
      --line: rgba(255, 255, 255, 0.12);
      --text: #e6ecf5;
      --muted: #a8b3c7;
      --danger: #fda4af;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #060913;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: none;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .bg img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .bg.loaded { opacity: 1; }

    #app {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      transition: padding-bottom 0.2s ease-out;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 34px 30px 28px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(1.15);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(99, 102, 241, 0.06),
        0 20px 60px rgba(56, 189, 248, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(199, 210, 254, 0.75), transparent);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 24px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow:
        0 10px 30px rgba(99, 102, 241, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .logo svg { width: 24px; height: 24px; }

    .brand-text h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .brand-text p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0.03em;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .field { position: relative; }

    .input-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 44px;
      z-index: 2;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: text;
      -webkit-tap-highlight-color: transparent;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 46px;
      padding: 0 44px 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      outline: none;
      background: rgba(2, 6, 23, 0.62);
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0.08em;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input::placeholder { color: #667085; letter-spacing: 0.12em; }

    input:focus {
      border-color: rgba(129, 140, 248, 0.9);
      background: rgba(2, 6, 23, 0.74);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .toggle {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .toggle:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .toggle svg { width: 18px; height: 18px; }

    .code-hint {
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .error {
      min-height: 17px;
      margin: 8px 1px 0;
      color: var(--danger);
      font-size: 12px;
    }

    .submit {
      position: relative;
      width: 100%;
      height: 46px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5 58%, #0ea5e9 135%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: filter 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
      box-shadow:
        0 14px 32px rgba(79, 70, 229, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .submit:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow:
        0 18px 38px rgba(79, 70, 229, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .submit:active:not(:disabled) { transform: translateY(0); }
    .submit:disabled { cursor: default; opacity: 0.75; }

    .spinner {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .submit.loading span.label { display: none; }
    .submit.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .foot {
      margin: 20px 0 0;
      color: rgba(168, 179, 199, 0.7);
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .success {
      position: relative;
      overflow: hidden;
      padding: 38px 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(1.15);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(99, 102, 241, 0.06),
        0 20px 60px rgba(56, 189, 248, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      text-align: center;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .success::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(199, 210, 254, 0.75), transparent);
    }

    .check {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      font-size: 24px;
    }

    .success h1 { margin: 0 0 8px; font-size: 18px; }
    .success p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .success a { color: #a5b4fc; text-decoration: none; }
    .success a:hover { text-decoration: underline; }

    .hidden { display: none !important; }

    /* 背景图加载完成前的等待提示 */
    .boot {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(230, 236, 245, 0.92);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .boot p {
      margin: 0;
      padding: 7px 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .boot-ring {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(165, 180, 252, 0.9);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @media (max-width: 420px) {
      .card { padding: 28px 22px 22px; border-radius: 20px; }
      .success { padding: 32px 22px; border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="boot" id="boot" aria-live="polite">
    <div class="boot-ring" aria-hidden="true"></div>
    <p>正在加载…</p>
  </div>

  <main id="main" class="hidden">
    <form class="card" id="form" novalidate>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10.5" width="16" height="10" rx="2.5" />
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
            <circle cx="12" cy="15.5" r="1.2" fill="white" stroke="none" />
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="site-name">统一登录</h1>
          <p>一次登录，访问全部服务</p>
        </div>
      </div>

      <label for="access-code">访问密码</label>
      <div class="field">
        <input
          id="access-code"
          name="access-code"
          type="password"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="••••••••"
        />
        <button
          class="input-overlay hidden"
          id="input-overlay"
          type="button"
          aria-label="选择密码工具，或再次点击输入密码"
        ></button>
        <button class="toggle" id="toggle" type="button" aria-label="显示密码" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
            <circle cx="12" cy="12" r="2.6" />
          </svg>
        </button>
      </div>

      <p class="code-hint hidden" id="code-hint">点击一次选择密码工具，再次点击输入密码</p>

      <p class="error" id="error" role="alert" aria-live="polite"></p>

      <button class="submit" id="submit" type="submit">
        <span class="label">登 录</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p class="foot">登录状态将在同一父域下的服务间共享</p>
    </form>

    <div class="success hidden" id="success">
      <div class="check" aria-hidden="true">✓</div>
      <h1>已登录</h1>
      <p id="success-text">可以关闭此页面，或前往 <a id="home-link" href="/">首页</a>。</p>
    </div>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const form = $('form');
      const input = $('access-code');
      const codeHint = $('code-hint');
      const overlay = $('input-overlay');

      // 第一次点击：透明覆盖层主动聚焦密码框，inputmode=none 不弹键盘；
      // 第二次点击：切到 text、加忽略属性并重新聚焦，弹出系统键盘。
      let keyboardEnabled = focusOnReveal;
      let suppressManagers = focusOnReveal;
      let firstTapDone = false;

      function applySuppression() {
        const on = suppressManagers;
        input.setAttribute('autocomplete', on ? 'off' : 'current-password');

        const attrs = {
          'data-1p-ignore': '',
          'data-bwignore': 'true',
          'data-lpignore': 'true',
          'data-protonpass-ignore': 'true',
          'data-dashlane-ignore': 'true',
          'data-form-type': 'other',
        };
        for (const [name, value] of Object.entries(attrs)) {
          if (on) input.setAttribute(name, value);
          else input.removeAttribute(name);
        }

        if (on) {
          form.setAttribute('data-1p-ignore', '');
          form.setAttribute('data-form-type', 'other');
          form.setAttribute('autocomplete', 'off');
        } else {
          form.removeAttribute('data-1p-ignore');
          form.removeAttribute('data-form-type');
          form.setAttribute('autocomplete', 'on');
        }
      }

      function syncCodeUi() {
        input.setAttribute('inputmode', keyboardEnabled ? 'text' : 'none');
        if (codeHint) codeHint.classList.toggle('hidden', keyboardEnabled);
        if (overlay) overlay.classList.toggle('hidden', keyboardEnabled || focusOnReveal);
      }

      function enableKeyboardForCode() {
        keyboardEnabled = true;
        suppressManagers = true;
        applySuppression();
        syncCodeUi();
        input.blur();
        input.focus();
      }

      if (overlay) {
        overlay.addEventListener('click', () => {
          if (!firstTapDone) {
            firstTapDone = true;
            input.focus();
            return;
          }
          enableKeyboardForCode();
        });
      }

      applySuppression();
      syncCodeUi();

      const errorEl = $('error');
      const submit = $('submit');
      const toggle = $('toggle');
      const successBox = $('success');
      const successText = $('success-text');
      const homeLink = $('home-link');
      const bg = $('bg');
      const main = $('main');
      const bootBox = $('boot');

      const WALLPAPER_TIMEOUT_MS = 8000;
      const focusOnReveal =
        !window.matchMedia || window.matchMedia('(pointer: fine)').matches;

      // 移动端键盘适配：visualViewport 缩小时把卡片整体上移。
      (function setupKeyboardInset() {
        const viewport = window.visualViewport;
        if (!viewport) return;
        let frame = 0;

        function measure() {
          const layoutHeight = document.documentElement.clientHeight;
          const raw = layoutHeight - viewport.height - viewport.offsetTop;
          const inset = viewport.scale > 1.01 ? 0 : raw > 100 ? Math.round(raw) : 0;
          main.style.paddingBottom = inset ? `${inset}px` : '';
        }

        function schedule() {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(measure);
        }

        viewport.addEventListener('resize', schedule);
        viewport.addEventListener('scroll', schedule);
        window.addEventListener('resize', schedule);
        measure();
      })();

      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '';
      let submitting = false;

      function setLoading(loading) {
        submit.classList.toggle('loading', loading);
        submit.disabled = loading;
        input.disabled = loading;
      }

      function isSafeNext(value) {
        if (!/^https?:\/\//i.test(value)) return false;
        try {
          const target = new URL(value);
          const host = target.hostname.toLowerCase();
          const base = location.hostname.toLowerCase();
          const parent = base.split('.').slice(1).join('.');
          return host === base || (!!parent && (host === parent || host.endsWith('.' + parent)));
        } catch (_) {
          return false;
        }
      }

      function showSuccess(text) {
        form.classList.add('hidden');
        successBox.classList.remove('hidden');
        if (text) successText.textContent = text;
        // next 只接受同父域下的绝对 http(s) 地址，避免被塞入任意外链。
        if (isSafeNext(next)) {
          homeLink.href = next;
          homeLink.textContent = '返回刚才的页面';
        }
      }

      function go(target) {
        location.replace(target);
      }

      // 等背景图真正加载完再露出登录卡片；失败或超时就退回渐变背景，避免卡死。
      function preloadWallpaper(url) {
        return new Promise((resolve) => {
          if (!url) {
            resolve();
            return;
          }

          let settled = false;
          const done = () => {
            if (settled) return;
            settled = true;
            resolve();
          };

          const image = new Image();
          image.alt = '';
          image.onload = () => {
            // 直接把已经加载好的图片挂进背景层，避免 no-store 壁纸再发一次请求。
            bg.textContent = '';
            bg.appendChild(image);
            bg.classList.add('loaded');
            done();
          };
          image.onerror = done;
          image.src = url;
          setTimeout(done, WALLPAPER_TIMEOUT_MS);
        });
      }

      function reveal() {
        bootBox.classList.add('hidden');
        main.classList.remove('hidden');
        if (focusOnReveal && !form.classList.contains('hidden')) input.focus();
      }

      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        input.focus();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submitting) return;
        const password = input.value;
        if (!password) {
          errorEl.textContent = '请输入访问密码';
          enableKeyboardForCode();
          return;
        }

        submitting = true;
        errorEl.textContent = '';
        setLoading(true);

        try {
          const response = await fetch(
            '/api/auth/login?next=' + encodeURIComponent(next),
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ password }),
            },
          );
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.detail || `登录失败（${response.status}）`);
          }
          if (data.redirect) {
            go(data.redirect);
            return;
          }
          showSuccess();
          submitting = false;
          setLoading(false);
        } catch (err) {
          errorEl.textContent = err && err.message ? err.message : '登录失败，请稍后重试';
          input.value = '';
          enableKeyboardForCode();
          submitting = false;
          setLoading(false);
        }
      });

      async function boot() {
        let config = {};
        let status = {};

        try {
          [config, status] = await Promise.all([
            fetch('/api/config', { credentials: 'same-origin' }).then((r) => r.json()).catch(() => ({})),
            fetch('/api/auth/status?next=' + encodeURIComponent(next), { credentials: 'same-origin' })
              .then((r) => r.json())
              .catch(() => ({})),
          ]);

          if (config.site_name) {
            $('site-name').textContent = config.site_name;
            document.title = config.site_name;
          }
        } catch (_) {
          /* 配置加载失败不影响手动登录 */
        }

        // 已登录且知道要回哪：直接跳走，不需要等背景图。
        if (status.authenticated && status.redirect) {
          go(status.redirect);
          return;
        }

        // 必须等背景图加载完成（或失败/超时）后再显示登录界面。
        await preloadWallpaper(config.wallpaper_url);

        if (status.authenticated) {
          showSuccess('当前已是登录状态，可以关闭此页面。');
        }
        reveal();
      }

      boot();
    })();
  </script>
</body>
</html>
